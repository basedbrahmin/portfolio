# Backup pinger in case the server's own keep-alive misses (e.g. right after a deploy).
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        env:
          API_URL: https://portfolio-pq5n.onrender.com
        run: |
          curl -fsS --retry 3 --retry-delay 15 --max-time 90 "$API_URL/api/health" || echo "::warning::API not reachable yet"
