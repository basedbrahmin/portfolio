# Backup pinger in case the server's own keep-alive misses (e.g. right after a deploy).
# Set the repository variable API_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::Repository variable API_URL is not set"
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 15 --max-time 90 "$API_URL/api/health"
