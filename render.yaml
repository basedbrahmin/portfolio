# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: ashmit-portfolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
